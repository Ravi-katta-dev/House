<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>5-Bedroom American Suburban House — Interactive 3D</title>
<style>
  :root{
    --panel-bg: rgba(16,22,30,0.82);
    --panel-br: rgba(255,255,255,0.10);
    --accent: #4fa8ff;
    --accent2:#8fd3ff;
    --text:#e8eef5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1017;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- Control panel ---------- */
  #panel{
    position:absolute; top:14px; left:14px; width:262px; max-height:calc(100% - 28px);
    overflow-y:auto; background:var(--panel-bg); backdrop-filter: blur(14px) saturate(140%);
    border:1px solid var(--panel-br); border-radius:14px; padding:12px 12px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); z-index:20; font-size:12px;
  }
  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
  #panel h1{
    font-size:12.5px;margin:0 0 2px;letter-spacing:.06em;text-transform:uppercase;
    font-weight:700;color:#fff
  }
  #panel .sub{font-size:10.5px;color:#93a4b8;margin-bottom:10px;letter-spacing:.02em}
  .sec{margin-top:11px;border-top:1px solid rgba(255,255,255,.08);padding-top:9px}
  .sec:first-of-type{border-top:none;padding-top:0}
  .sec-title{
    font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7f93ab;
    margin:0 0 7px;font-weight:700
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .grid.one{grid-template-columns:1fr}
  button.btn{
    appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);
    color:var(--text);border-radius:8px;padding:7px 6px;font-size:11px;cursor:pointer;
    transition:.13s ease; font-weight:500; letter-spacing:.01em; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  button.btn:hover{background:rgba(79,168,255,.20);border-color:rgba(79,168,255,.55)}
  button.btn.active{background:linear-gradient(180deg,#3d8fdd,#2a6fb5);border-color:#63b3ff;color:#fff;
    box-shadow:0 0 0 1px rgba(99,179,255,.35), 0 4px 14px rgba(40,120,220,.35)}
  .toggle{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none;
    border:1px solid transparent;transition:.13s
  }
  .toggle:hover{background:rgba(255,255,255,.05)}
  .toggle span{font-size:11px}
  .sw{width:32px;height:17px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:.16s;flex:0 0 auto}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#c9d6e4;transition:.16s}
  .toggle.on .sw{background:linear-gradient(90deg,#3d8fdd,#63b3ff)}
  .toggle.on .sw::after{left:17px;background:#fff}

  /* ---------- Info card ---------- */
  #info{
    position:absolute; right:14px; top:14px; width:250px; z-index:20;
    background:var(--panel-bg); backdrop-filter:blur(14px) saturate(140%);
    border:1px solid var(--panel-br); border-radius:14px; padding:13px 14px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); font-size:12px;
    opacity:0; transform:translateY(-6px); pointer-events:none; transition:.18s
  }
  #info.show{opacity:1;transform:none;pointer-events:auto}
  #info .rn{font-size:15px;font-weight:700;color:#fff;margin-bottom:2px}
  #info .rf{font-size:10.5px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
  #info .row{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid rgba(255,255,255,.07)}
  #info .row b{font-weight:600;color:#fff}
  #info .close{margin-top:10px;width:100%}

  /* ---------- Footer hint ---------- */
  #hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(16,22,30,.72);backdrop-filter:blur(10px);
    border:1px solid var(--panel-br);border-radius:999px;padding:7px 16px;
    font-size:11px;color:#a9bccf;z-index:20;white-space:nowrap;letter-spacing:.02em
  }
  #hint b{color:#e8eef5}
  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b1017;z-index:100;font-size:13px;color:#8fa5bb;letter-spacing:.1em
  }
  @media (max-width:720px){
    #panel{width:200px;font-size:11px}
    #info{width:190px}
    #hint{font-size:9.5px;padding:6px 10px}
  }
</style>
</head>
<body>
<div id="loading">BUILDING MODEL…</div>
<div id="app"></div>

<!-- ==================== CONTROL PANEL ==================== -->
<div id="panel">
  <h1>Residence&nbsp;3D</h1>
  <div class="sub">5 Bed · 4.5 Bath · ~3,500 sq ft</div>

  <div class="sec">
    <div class="sec-title">View</div>
    <div class="grid">
      <button class="btn" data-view="exterior">Exterior</button>
      <button class="btn" data-view="full">Full House</button>
      <button class="btn" data-view="ground">Ground Floor</button>
      <button class="btn" data-view="upper">Upper Floor</button>
      <button class="btn" data-view="cutaway">Cutaway</button>
      <button class="btn" data-view="top">Top / Plan</button>
      <button class="btn" data-view="front">Front Elev.</button>
      <button class="btn" data-view="rear">Rear Elev.</button>
      <button class="btn" data-view="left">Left Elev.</button>
      <button class="btn" data-view="right">Right Elev.</button>
    </div>
  </div>

  <div class="sec">
    <div class="sec-title">Toggles</div>
    <div class="toggle on" data-toggle="roof"><span>Roof</span><div class="sw"></div></div>
    <div class="toggle on" data-toggle="upper"><span>Upper Floor</span><div class="sw"></div></div>
    <div class="toggle on" data-toggle="interior"><span>Interior Walls</span><div class="sw"></div></div>
    <div class="toggle on" data-toggle="furniture"><span>Furniture</span><div class="sw"></div></div>
    <div class="toggle on" data-toggle="labels"><span>Room Labels</span><div class="sw"></div></div>
    <div class="toggle" data-toggle="dims"><span>Dimensions</span><div class="sw"></div></div>
    <div class="toggle on" data-toggle="walls"><span>Exterior Walls</span><div class="sw"></div></div>
    <div class="toggle" data-toggle="blueprint"><span>Blueprint Mode</span><div class="sw"></div></div>
  </div>

  <div class="sec">
    <div class="sec-title">Camera</div>
    <div class="grid">
      <button class="btn" id="camOrbit">Orbit</button>
      <button class="btn" id="camPan">Pan</button>
      <button class="btn" id="camZoom">Zoom</button>
      <button class="btn" id="camReset">Reset</button>
    </div>
  </div>
</div>

<div id="info">
  <div class="rn" id="iName">Room</div>
  <div class="rf" id="iFloor">Ground Floor</div>
  <div class="row"><span>Dimensions</span><b id="iDim">—</b></div>
  <div class="row"><span>Area</span><b id="iArea">—</b></div>
  <div class="row"><span>Ceiling</span><b id="iCeil">—</b></div>
  <button class="btn close" id="iClose">Close</button>
</div>

<div id="hint"><b>Drag</b> orbit · <b>Scroll</b> zoom · <b>Right-drag</b> pan · <b>Click a room</b> for details</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = 4;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* =====================================================================
   6.  WALL BUILDER (with real openings cut out)
   ===================================================================== */

const WALLS = [];   // master list of every wall segment (for opening matching)

function buildWall(ax, az, bx, bz, y0, y1, t, mat, group, isExt){
  const dx = bx-ax, dz = bz-az;
  const len = Math.hypot(dx, dz);
  if (len < 0.02 || y1-y0 < 0.02) return null;

  const ux = dx/len, uz = dz/len;
  const ry = Math.atan2(-dz, dx);

  const wall = {ax, az, bx, bz, y0, y1, len, ux, uz, ry, t, mat, group, isExt, openings:[]};
  WALLS.push(wall);

  const piece = (u0, u1, yy0, yy1) => {
    const L = u1-u0, H = yy1-yy0;
    if (L <= 0.004 || H <= 0.004) return;
    const cx = ax + ux*(u0 + L/2);
    const cz = az + uz*(u0 + L/2);
    const m = new THREE.Mesh(BOX, mat);
    m.scale.set(L, H, t);
    m.position.set(cx, (yy0+yy1)/2, cz);
    m.rotation.y = ry;
    m.castShadow = true; m.receiveShadow = true;
    m.userData.wall = wall;
    group.add(m);
  };

  const ops = wall.openings;
  let cur = 0;
  for (const o of ops) {
    if (o.u > cur) piece(cur, o.u, y0, y1);
    if (o.y1 < y1 - 0.01) piece(o.u, o.u+o.w, o.y1, y1);   // lintel
    if (o.y0 > y0 + 0.01) piece(o.u, o.u+o.w, y0, o.y0);   // sill / under-window
    cur = Math.max(cur, o.u + o.w);
  }
  if (cur < len) piece(cur, len, y0, y1);

  return wall;
}

/* ---- opening assignment ---- */
function assignOpenings(walls, openings){
  for (const o of openings){
    let best = null, bestU = 0, bestPerp = 1e9;
    for (const w of walls){
      if (o.y0 < w.y0 - 0.02 || o.y1 > w.y1 + 0.02) continue;
      const px = o.cx - w.ax, pz = o.cz - w.az;
      const u = px*w.ux + pz*w.uz;
      const perp = Math.abs(px*(-w.uz) + pz*w.ux);
      if (perp > 0.30) continue;
      if (u - o.w/2 < -0.06 || u + o.w/2 > w.len + 0.06) continue;
      if (perp < bestPerp){ bestPerp = perp; best = w; bestU = u; }
    }
    if (best){
      best.openings.push({u: bestU - o.w/2, w: o.w, y0: o.y0, y1: o.y1, type:o.type});
      best.openings.sort((a,b)=>a.u-b.u);
      o._wall = best; o._u = bestU;
    }
  }
}

/* =====================================================================
   7.  INTERIOR WALL DERIVATION FROM ROOM RECTANGLES
   ===================================================================== */

function mergeIntervals(list){
  list.sort((a,b)=>a[0]-b[0]);
  const out = [];
  for (const iv of list){
    if (!out.length || iv[0] > out[out.length-1][1] + 0.001) out.push([iv[0], iv[1]]);
    else out[out.length-1][1] = Math.max(out[out.length-1][1], iv[1]);
  }
  return out;
}

function coveredByExterior(ax, az, bx, bz, extList){
  const horiz = Math.abs(az-bz) < 0.01;
  for (const w of extList){
    const wh = Math.abs(w.az-w.bz) < 0.01;
    if (horiz !== wh) continue;
    if (horiz){
      if (Math.abs(az - w.az) > 0.01) continue;
      const a0 = Math.min(w.ax,w.bx), a1 = Math.max(w.ax,w.bx);
      const s0 = Math.min(ax,bx), s1 = Math.max(ax,bx);
      if (s0 >= a0-0.02 && s1 <= a1+0.02) return true;
    } else {
      if (Math.abs(ax - w.ax) > 0.01) continue;
      const a0 = Math.min(w.az,w.bz), a1 = Math.max(w.az,w.bz);
      const s0 = Math.min(az,bz), s1 = Math.max(az,bz);
      if (s0 >= a0-0.02 && s1 <= a1+0.02) return true;
    }
  }
  return false;
}

function deriveInteriorWalls(rooms, y0, y1, t, mat, extList, group){
  const vLines = new Map();   // x -> [[z0,z1]...]
  const hLines = new Map();   // z -> [[x0,x1]...]
  const push = (map, key, iv) => {
    const k = Math.round(key*1000)/1000;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(iv);
  };

  for (const r of rooms){
    push(vLines, r.x0, [r.z0, r.z1]);
    push(vLines, r.x1, [r.z0, r.z1]);
    push(hLines, r.z0, [r.x0, r.x1]);
    push(hLines, r.z1, [r.x0, r.x1]);
  }

  const created = [];

  for (const [x, ivs] of vLines){
    for (const [z0, z1] of mergeIntervals(ivs)){
      if (coveredByExterior(x, z0, x, z1, extList)) continue;
      const w = buildWall(x, z0, x, z1, y0, y1, t, mat, group, false);
      if (w) created.push(w);
    }
  }
  for (const [z, ivs] of hLines){
    for (const [x0, x1] of mergeIntervals(ivs)){
      if (coveredByExterior(x0, z, x1, z, extList)) continue;
      const w = buildWall(x0, z, x1, z, y0, y1, t, mat, group, false);
      if (w) created.push(w);
    }
  }
  return created;
}

/* ---------- 8.6  WINDOW / DOOR GEOMETRY ---------- */
function addWindowAssembly(o){
  const w = o._wall; if (!w) return;
  const u = o._u;
  const cx = w.ax + w.ux*u, cz = w.az + w.uz*u;
  const h = o.y1 - o.y0;
  const ry = w.ry;

  const grp = new THREE.Group();
  grp.position.set(cx, (o.y0+o.y1)/2, cz);
  grp.rotation.y = ry;

  // glass
  const glass = new THREE.Mesh(BOX, MAT.glass);
  glass.scale.set(o.w-0.12, h-0.12, 0.04);
  grp.add(glass);

  // outer frame
  const ft = 0.075, fd = 0.13;
  const mk = (sw,sh,sx,sy)=>{
    const m = new THREE.Mesh(BOX, MAT.frame);
    m.scale.set(sw,sh,fd); m.position.set(sx,sy,0);
    m.castShadow = true; m.receiveShadow = true; grp.add(m);
  };
  mk(o.w, ft*2, 0,  h/2 - ft);
  mk(o.w, ft*2, 0, -h/2 + ft);
  mk(ft*2, h, -o.w/2 + ft, 0);
  mk(ft*2, h,  o.w/2 - ft, 0);
  // mullions
  if (o.w > 1.1){
    mk(ft*1.6, h, 0, 0);
    const half = (o.w/2 - ft*2);
    mk(ft*1.2, half, -o.w/2 + ft + half/2 + ft, 0);
    mk(ft*1.2, half,  o.w/2 - ft - half/2 - ft, 0);
  }
  // sill
  const sill = new THREE.Mesh(BOX, MAT.trim);
  sill.scale.set(o.w+0.16, 0.07, 0.22);
  sill.position.set(0, -h/2 - 0.03, 0.06);
  sill.castShadow = true; grp.add(sill);

  grp.traverse(m=>{ if(m.isMesh){ m.userData.tag='window'; m.castShadow=true; m.receiveShadow=true; } });
  G.windows.add(grp);
}

function addDoorAssembly(o){
  const w = o._wall; if (!w) return;
  const u = o._u;
  const cx = w.ax + w.ux*u, cz = w.az + w.uz*u;
  const h = o.y1 - o.y0;

  const grp = new THREE.Group();
  grp.position.set(cx, (o.y0+o.y1)/2, cz);
  grp.rotation.y = w.ry;

  const slab = new THREE.Mesh(BOX, o.type==='door' ? MAT.door : MAT.trim);
  slab.scale.set(o.w-0.06, h-0.04, 0.06);
  slab.castShadow = true; slab.receiveShadow = true;
  grp.add(slab);

  // simple panel detailing
  for (const yy of [0.22, -0.22]){
    const p = new THREE.Mesh(BOX, MAT.trim);
    p.scale.set(o.w*0.62, h*0.30, 0.012);
    p.position.set(0, yy*h*0.5, 0.036);
    grp.add(p);
  }
  // knob
  const knob = new THREE.Mesh(CYL, MAT.steel);
  knob.scale.set(0.035, 0.05, 0.035);
  knob.rotation.z = Math.PI/2;
  knob.position.set(o.w/2 - 0.16, 0, 0.07);
  grp.add(knob);

  // jamb
  const j = new THREE.Mesh(BOX, MAT.trim);
  j.scale.set(o.w+0.10, 0.06, 0.16);
  j.position.set(0, h/2+0.02, 0);
  grp.add(j);

  grp.traverse(m=>{ if(m.isMesh) m.userData.tag='door'; });
  G.doors.add(grp);
}

function addGarageDoor(o){
  const w = o._wall; if (!w) return;
  const u = o._u;
  const cx = w.ax + w.ux*u, cz = w.az + w.uz*u;
  const h = o.y1 - o.y0;

  const grp = new THREE.Group();
  grp.position.set(cx, (o.y0+o.y1)/2, cz);
  grp.rotation.y = w.ry;

  const panel = new THREE.Mesh(BOX, MAT.garage);
  panel.scale.set(o.w-0.05, h-0.05, 0.09);
  panel.castShadow = true; panel.receiveShadow = true;
  grp.add(panel);

  // horizontal panel grooves
  for (let i=1; i<4; i++){
    const y = -h/2 + (h/4)*i;
    const gline = new THREE.Mesh(BOX, MAT.dark);
    gline.scale.set(o.w-0.08, 0.035, 0.02);
    gline.position.set(0, y, 0.052);
    grp.add(gline);
  }
  // vertical centre line
  const vline = new THREE.Mesh(BOX, MAT.dark);
  vline.scale.set(0.035, h-0.08, 0.02);
  vline.position.set(0, 0, 0.052);
  grp.add(vline);

  // trim surround
  const surround = new THREE.Mesh(BOX, MAT.trim);
  surround.scale.set(o.w+0.30, 0.16, 0.20);
  surround.position.set(0, h/2+0.06, 0.02);
  grp.add(surround);

  grp.traverse(m=>{ if(m.isMesh) m.userData.tag='door'; });
  G.doors.add(grp);
}

for (const o of OPENINGS){
  if (!o._wall) continue;
  if (o.type === 'window') addWindowAssembly(o);
  else if (o.type === 'door') addDoorAssembly(o);
  else if (o.type === 'garage') addGarageDoor(o);
}

/* ---------- 8.7  GABLE END WALLS (triangles) ---------- */
function gableTriangle(x0, x1, yEave, yRidge, z, thickness, mat){
  const shape = new THREE.Shape();
  shape.moveTo(x0, yEave);
  shape.lineTo(x1, yEave);
  shape.lineTo((x0+x1)/2, yRidge);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {depth: thickness, bevelEnabled:false});
  const m = new THREE.Mesh(geo, mat);
  m.position.set(0, 0, z - thickness/2);
  m.castShadow = true; m.receiveShadow = true;
  m.userData.tag = 'wall';
  G.wallsExt.add(m);
  return m;
}

const roofGroup = G.roof;

function roofMaterial(len, depth){
  const m = MAT.roof.clone();
  m.map = shingleTex.clone();
  m.map.needsUpdate = true;
  m.map.wrapS = m.map.wrapT = THREE.RepeatWrapping;
  m.map.repeat.set(Math.max(1, len/1.25), Math.max(1, depth/1.25));
  return m;
}

/**
 * Gable roof.
 * axis 'z' -> ridge runs along Z (gable ends face ±Z)
 * axis 'x' -> ridge runs along X (gable ends face ±X)
 */
function addGableRoof(x0, x1, z0, z1, eaveY, ridgeY, axis, roofMat, fasciaMat){
  const O = C.roof.overhang;
  const T = C.roof.thickness;
  const grp = new THREE.Group();

  const ex0 = x0 - O, ex1 = x1 + O, ez0 = z0 - O, ez1 = z1 + O;

  if (axis === 'z'){
    const rx = (x0 + x1)/2;
    const pitch = (ridgeY - eaveY) / Math.max(0.001, (rx - x0));
    const eaveDropY = eaveY - O*pitch;
    const depth = ez1 - ez0;
    const cz = (ez0 + ez1)/2;

    const mkSlope = (fromX, toX, yFrom, yTo, sign) => {
      const run = Math.abs(toX - fromX);
      const rise = yTo - yFrom;
      const L = Math.hypot(run, rise);
      const ang = Math.atan2(rise, run);
      const m = new THREE.Mesh(BOX, roofMat(L, depth));
      m.scale.set(L, T, depth);
      m.position.set((fromX + toX)/2, (yFrom + yTo)/2, cz);
      m.rotation.z = ang;
      m.castShadow = true; m.receiveShadow = true;
      m.userData.tag = 'roof';
      grp.add(m);
    };
    mkSlope(ex0, rx, eaveDropY, ridgeY, 1);
    mkSlope(ex1, rx, eaveDropY, ridgeY, -1);

    // fascia at both eaves
    const fy = eaveDropY;
    const f1 = mkBox(0.10, C.roof.fascia, depth, fasciaMat, ex0, fy - C.roof.fascia/2, cz);
    const f2 = mkBox(0.10, C.roof.fascia, depth, fasciaMat, ex1, fy - C.roof.fascia/2, cz);
    f1.userData.tag = f2.userData.tag = 'roof';
    grp.add(f1, f2);

    // ridge cap
    const cap = mkBox(0.34, 0.14, depth, roofMat(1,1), rx, ridgeY + 0.03, cz);
    cap.userData.tag = 'roof';
    grp.add(cap);

  } else {
    const rz = (z0 + z1)/2;
    const pitch = (ridgeY - eaveY) / Math.max(0.001, (rz - z0));
    const eaveDropY = eaveY - O*pitch;
    const width = ex1 - ex0;
    const cx = (ex0 + ex1)/2;

    const mkSlope = (fromZ, toZ, yFrom, yTo) => {
      const run = Math.abs(toZ - fromZ);
      const rise = yTo - yFrom;
      const L = Math.hypot(run, rise);
      const ang = Math.atan2(rise, run);
      const m = new THREE.Mesh(BOX, roofMat(width, L));
      m.scale.set(width, T, L);
      m.position.set(cx, (yFrom + yTo)/2, (fromZ + toZ)/2);
      m.rotation.x = -ang;
      m.castShadow = true; m.receiveShadow = true;
      m.userData.tag = 'roof';
      grp.add(m);
    };
    mkSlope(ez0, rz, eaveDropY, ridgeY);
    mkSlope(ez1, rz, eaveDropY, ridgeY);

    const fy = eaveDropY;
    const f1 = mkBox(width, C.roof.fascia, 0.10, fasciaMat, cx, fy - C.roof.fascia/2, ez0);
    const f2 = mkBox(width, C.roof.fascia, 0.10, fasciaMat, cx, fy - C.roof.fascia/2, ez1);
    f1.userData.tag = f2.userData.tag = 'roof';
    grp.add(f1, f2);

    const cap = mkBox(width, 0.14, 0.34, roofMat(1,1), cx, ridgeY + 0.03, rz);
    cap.userData.tag = 'roof';
    grp.add(cap);
  }

  roofGroup.add(grp);
  return grp;
}

/* ---------- 8.11  STAIRS ---------- */
(function stairs(){
  const x0 = -4.6, x1 = -2.4, z0 = -0.6, z1 = 2.4;
  const w = x1 - x0;            // 2.2
  const totalRise = C.upperY - C.groundY;   // 3.25
  const risers = 17;
  const tread = 0.27;
  const riser = totalRise / risers;

  // run 1: up along -Z from z1 side, half the width
  const halfW = w/2 - 0.04;
  const runX = x0 + halfW/2 + 0.02;

  let y = C.groundY;
  let z = z1 - 0.35;
  const steps1 = 9;
  for (let i=0;i<steps1;i++){
    z -= tread;
    y += riser;
    const s = mkBox(halfW, 0.20, tread, MAT.wood, runX, y - 0.10, z + tread/2);
    s.userData.tag = 'furniture';
    G.furniture.add(s);
    const r = mkBox(halfW, riser, 0.05, MAT.trim, runX, y - riser/2, z + tread);
    G.furniture.add(r);
  }
  // landing
  const landing = mkBox(halfW, 0.20, 1.0, MAT.wood, runX, y + 0.10, z - 0.5);
  G.furniture.add(landing);

  // run 2: back along +Z in the other half
  const run2X = x0 + w - halfW/2 - 0.02;
  let y2 = y + riser*0;
  let z2 = z - 0.9;
  const steps2 = risers - steps1;
  for (let i=0;i<steps2;i++){
    z2 += tread;
    y2 += riser;
    const s = mkBox(halfW, 0.20, tread, MAT.wood, run2X, y2 - 0.10, z2);
    G.furniture.add(s);
    const r = mkBox(halfW, riser, 0.05, MAT.trim, run2X, y2 - riser/2, z2 - tread/2);
    G.furniture.add(r);
  }
  // railings
  const rail = mkBox(0.06, 1.0, 2.6, MAT.woodFurn, (x0+x1)/2, C.groundY + 1.4, 1.0);
  G.furniture.add(rail);
  G.furniture.children.forEach(m=>{ m.castShadow = true; m.receiveShadow = true; m.userData.tag='furniture'; });
})();

function fBox(w,h,d, mat, x,y,z, ry=0){

function fCyl(r,h, mat, x,y,z, seg){
  const m = new THREE.Mesh(seg?new THREE.CylinderGeometry(r,r,h,seg):CYL, mat);
  m.scale.set(1,h,1); m.position.set(x,y,z);

const FY0 = C.groundY;   // ground floor level
const FY1 = C.upperY;    // upper floor level

/* ---- bed ---- */
function bed(cx, cz, w, l, ry, mat){
  const g = new THREE.Group();
  const base = mkBox(w, 0.35, l, MAT.woodFurn, 0, 0.18, 0);
  const matt = mkBox(w-0.12, 0.30, l-0.12, MAT.fixture, 0, 0.50, 0);
  const head = mkBox(w+0.10, 0.95, 0.12, MAT.woodFurn, 0, 0.48, -l/2-0.05);
  const p1 = mkBox(w*0.42, 0.14, 0.5, MAT.fixture, -w*0.22, 0.68, -l/2+0.42);
  const p2 = mkBox(w*0.42, 0.14, 0.5, MAT.fixture,  w*0.22, 0.68, -l/2+0.42);
  const bl = mkBox(w-0.14, 0.10, l*0.55, mat, 0, 0.68, l*0.18);
  g.add(base, matt, head, p1, p2, bl);
  g.position.set(cx, FY0, cz);
  g.rotation.y = ry;
  g.traverse(m=>{ if(m.isMesh){ m.userData.tag='furniture'; m.castShadow=true; m.receiveShadow=true; G.furniture.add(m); } });
  // re-parent
  g.children.slice().forEach(c=>{ G.furniture.add(c); });
  g.position.set(0,0,0);
}
/* simpler: place beds directly */
function placeBed(cx, cz, w, l, ry, mat, y){
  const g = new THREE.Group();
  g.position.set(cx, y, cz); g.rotation.y = ry;
  const add = (geo, m, sx,sy,sz, px,py,pz)=>{
    const mm = new THREE.Mesh(geo, m); mm.scale.set(sx,sy,sz); mm.position.set(px,py,pz);
    mm.castShadow = true; mm.receiveShadow = true; mm.userData.tag='furniture'; g.add(mm);
  };
  add(BOX, MAT.woodFurn, w, 0.34, l, 0, 0.17, 0);
  add(BOX, MAT.fixture, w-0.12, 0.30, l-0.12, 0, 0.49, 0);
  add(BOX, MAT.woodFurn, w+0.12, 0.95, 0.12, 0, 0.47, -l/2-0.05);

const labelSprites = [];

function makeLabelSprite(text, sub, opts = {}){
  const pad = 18;
  const fs = 44;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = `700 ${fs}px ui-sans-serif, system-ui, Arial`;
  const w1 = ctx.measureText(text).width;
  ctx.font = `500 ${fs*0.62}px ui-sans-serif, system-ui, Arial`;
  const w2 = sub ? ctx.measureText(sub).width : 0;
  const W = Math.ceil(Math.max(w1, w2) + pad*2);
  const H = Math.ceil(fs*1.9 + (sub ? fs*0.8 : 0) + pad);
  canvas.width = W; canvas.height = H;

  const c2 = canvas.getContext('2d');
  // pill background
  const r = 16;
  c2.fillStyle = opts.bg || 'rgba(12,20,30,0.80)';
  c2.beginPath();
  c2.moveTo(r, 0); c2.lineTo(W-r, 0); c2.quadraticCurveTo(W, 0, W, r);
  c2.lineTo(W, H-r); c2.quadraticCurveTo(W, H, W-r, H);
  c2.lineTo(r, H); c2.quadraticCurveTo(0, H, 0, H-r);
  c2.lineTo(0, r); c2.quadraticCurveTo(0, 0, r, 0);
  c2.closePath(); c2.fill();

  c2.strokeStyle = opts.border || 'rgba(120,190,255,0.55)';
  c2.lineWidth = 3;
  c2.stroke();

  c2.textAlign = 'center';
  c2.fillStyle = opts.color || '#ffffff';
  c2.font = `700 ${fs}px ui-sans-serif, system-ui, Arial`;
  c2.fillText(text, W/2, pad*0.6 + fs*0.9);
  if (sub){
    c2.fillStyle = opts.subColor || '#8fd3ff';
    c2.font = `500 ${fs*0.62}px ui-sans-serif, system-ui, Arial`;
    c2.fillText(sub, W/2, pad*0.6 + fs*1.65);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, depthWrite:false});
  const spr = new THREE.Sprite(mat);
  const scale = 0.0075;
  spr.scale.set(W*scale, H*scale, 1);
  spr.renderOrder = 999;
  return spr;
}

function buildLabels(){
  for (const r of ROOMS){
    if (!r.name) continue;
    const cx = (r.x0 + r.x1)/2;
    const cz = (r.z0 + r.z1)/2;
    const y  = (r.fl === 0 ? C.groundY : C.upperY) + (r.kind === 'garage' ? 1.1 : 1.35);
    const areaFt = Math.round((r.x1-r.x0)*(r.z1-r.z0)*M2_TO_FT2);
    const spr = makeLabelSprite(r.name, `${areaFt} sq ft`, {
      color: r.fl === 0 ? '#ffffff' : '#e9f4ff',
      border: r.fl === 0 ? 'rgba(120,190,255,0.6)' : 'rgba(160,255,210,0.6)',
      subColor: r.fl === 0 ? '#8fd3ff' : '#9dffcf'
    });
    spr.position.set(cx, y, cz);
    spr.userData.tag = 'label';
    spr.userData.room = r;
    G.labels.add(spr);
    labelSprites.push(spr);
  }
}
buildLabels();

/* =====================================================================
   13.  DIMENSION ANNOTATIONS
   ===================================================================== */

(function dimensions(){
  const mat = new THREE.LineBasicMaterial({color:0x2e6ea6, transparent:true, opacity:0.95});
  const ext = 0.9, off = 1.6;

  function dimLine(x0, z0, x1, z1, text, side){
    const pts = [
      new THREE.Vector3(x0, 0.06, z0),
      new THREE.Vector3(x1, 0.06, z1)
    ];
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const l = new THREE.Line(g, mat);
    l.userData.tag = 'dims';
    G.dims.add(l);

    // ticks
    for (const p of [pts[0], pts[1]]){
      const t = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(p.x, 0.06, p.z - 0.25),
        new THREE.Vector3(p.x, 0.06, p.z + 0.25)
      ]);
      const tl = new THREE.Line(t, mat);
      G.dims.add(tl);
    }
    const spr = makeLabelSprite(text, null, {
      bg:'rgba(255,255,255,0.94)', color:'#123a5c', border:'rgba(46,110,166,0.9)'
    });
    const cx = (x0+x1)/2, cz = (z0+z1)/2;
    spr.position.set(cx, 0.45, cz);
    G.dims.add(spr);
  }

  const W = (C.x1-C.x0);
  const D = (C.z1-C.z0);

  dimLine(C.x0, C.z1 + off, C.x1, C.z1 + off, `${(W/FT).toFixed(1)} ft  (${W.toFixed(2)} m)`);
  dimLine(C.x0 - off, C.z0, C.x0 - off, C.z1, `${(D/FT).toFixed(1)} ft  (${D.toFixed(2)} m)`);
  dimLine(C.x0, C.z0 - off, C.x1, C.z0 - off, `REAR  ${(W/FT).toFixed(1)} ft`);
  dimLine(C.x1 + off, C.z0, C.x1 + off, C.z1, `RIGHT  ${(D/FT).toFixed(1)} ft`);

  // storey heights
  const h1 = makeLabelSprite(`Floor-to-floor ${(C.upperY/FT).toFixed(1)} ft`, null,
    {bg:'rgba(255,255,255,0.94)', color:'#123a5c', border:'rgba(46,110,166,0.9)'});
  h1.position.set(C.x0 - 0.6, 2.0, C.z1 + 1.0);
  G.dims.add(h1);

  // north arrow
  const na = new THREE.Group();
  const shaft = new THREE.Mesh(BOX, MAT.bpSolid);
  shaft.scale.set(0.09, 0.02, 1.6); na.add(shaft);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.6, 4), MAT.bpSolid);
  head.rotation.x = Math.PI/2; head.position.z = -1.05; na.add(head);
  const nl = makeLabelSprite('N', null, {bg:'rgba(255,255,255,0.95)', color:'#0d2d4d', border:'rgba(46,110,166,1)'});
  nl.position.set(0, 0.5, -1.9);
  nl.scale.multiplyScalar(0.75);
  na.add(nl);
  na.position.set(C.x0 - 5.5, 0.10, C.z0 - 3.0);
  na.traverse(o=>{ o.userData.tag='dims'; });
  G.dims.add(na);

  // scale bar
  const sb = new THREE.Group();
  const seg = 2;   // metres
  for (let i=0;i<3;i++){
    const b = new THREE.Mesh(BOX, i%2 ? MAT.bp : MAT.bpSolid);
    b.scale.set(seg, 0.03, 0.24);
    b.position.set(i*seg + seg/2, 0, 0);
    sb.add(b);
  }
  const sl = makeLabelSprite(`0        ${seg} m        ${seg*3} m`, null,
    {bg:'rgba(255,255,255,0.95)', color:'#0d2d4d', border:'rgba(46,110,166,1)'});
  sl.position.set(seg*1.5, 0.55, 0);
  sl.scale.multiplyScalar(0.85);
  sb.add(sl);
  sb.position.set(C.x0, 0.10, C.z0 - 3.0);
  sb.traverse(o=>{ o.userData.tag='dims'; });
  G.dims.add(sb);
})();

/* =====================================================================
   14.  VIEWS, TOGGLES, INTERACTION
   ===================================================================== */

const state = {
  roof:true, upper:true, interior:true, furniture:true,
  labels:true, dims:false, walls:true, blueprint:false
};

/* ---- camera presets ---- */
const CENTER = new THREE.Vector3(0, 3.0, 0);

const VIEWS = {
  exterior: {cam:'persp', pos:[ 22, 10.5, 25], tgt:[0, 2.6, 0]},
  full:     {cam:'persp', pos:[ 30, 20, 34],   tgt:[0, 3.0, 0]},
  ground:   {cam:'persp', pos:[ 11, 18, 17],   tgt:[0, 0.6, 0]},
  upper:    {cam:'persp', pos:[ 12, 20, 18],   tgt:[0, 3.6, 0]},
  cutaway:  {cam:'persp', pos:[ 20, 13, 22],   tgt:[0, 2.6, 0]},
  top:      {cam:'ortho', pos:[0, 60, 0.001],  tgt:[0,0,0], halfW:11.5, halfH:9.5, up:[0,0,-1]},
  front:    {cam:'ortho', pos:[0, 3.4, 46],    tgt:[0,3.4,0], halfW:10.5, halfH:7.0, up:[0,1,0]},
  rear:     {cam:'ortho', pos:[0, 3.4, -46],   tgt:[0,3.4,0], halfW:10.5, halfH:7.0, up:[0,1,0]},
  left:     {cam:'ortho', pos:[-46, 3.4, 0],   tgt:[0,3.4,0], halfW:9.5,  halfH:7.0, up:[0,1,0]},
  right:    {cam:'ortho', pos:[ 46, 3.4, 0],   tgt:[0,3.4,0], halfW:9.5,  halfH:7.0, up:[0,1,0]}
};

let currentView = 'exterior';

function applyView(name){
  currentView = name;
  const v = VIEWS[name];
  if (!v) return;

  // reset toggles that the view controls
  if (name === 'ground'){
    setToggle('roof', false); setToggle('upper', false);
    setToggle('interior', true); setToggle('walls', true);
    setToggle('furniture', true); setToggle('labels', true);
  } else if (name === 'upper'){
    setToggle('roof', false); setToggle('upper', true);
    setToggle('interior', true); setToggle('walls', true);
    setToggle('furniture', true); setToggle('labels', true);
  } else if (name === 'cutaway'){
    setToggle('roof', false); setToggle('upper', true);
    setToggle('interior', true); setToggle('walls', true);
    setToggle('furniture', true); setToggle('labels', true);
  } else if (name === 'top' || name === 'front' || name === 'rear' || name === 'left' || name === 'right'){
    setToggle('roof', true); setToggle('upper', true);
    setToggle('interior', true); setToggle('walls', true);
    setToggle('furniture', name==='top');
    setToggle('labels', name==='top');
  } else {
    setToggle('roof', true); setToggle('upper', true);
    setToggle('interior', name==='exterior' ? true : true);
    setToggle('walls', true);
    setToggle('furniture', name==='exterior' ? false : true);
    setToggle('labels', name==='exterior' ? false : true);
  }

  if (v.cam === 'ortho'){
    setOrthoFrustum(v.halfW, v.halfH);
    ortho.up.set(...(v.up || [0,1,0]));
    ortho.position.set(...v.pos);
    ortho.lookAt(...v.tgt);
    switchCamera(ortho);
    controls.target.set(...v.tgt);
    controls.enableRotate = false;
  } else {
    persp.position.set(...v.pos);
    switchCamera(persp);
    controls.target.set(...v.tgt);
    controls.enableRotate = true;
    controls.minDistance = 3;
    controls.maxDistance = 140;
  }
  controls.update();
  highlightViewButton(name);
}

function setOrthoFrustum(halfW, halfH){
  const aspect = innerWidth / innerHeight;
  let hw = halfW, hh = halfH;
  if (hw / hh > aspect) hh = hw / aspect;
  else hw = hh * aspect;
  ortho.left = -hw; ortho.right = hw;
  ortho.top = hh;  ortho.bottom = -hh;
  ortho.updateProjectionMatrix();
}

function switchCamera(cam){
  if (activeCam === cam) return;
  activeCam = cam;
  controls.object = cam;
  controls.update();
}

/* ---- toggles ---- */
function setToggle(key, on){
  state[key] = on;
  const el = document.querySelector(`.toggle[data-toggle="${key}"]`);
  if (el) el.classList.toggle('on', on);
  applyState();
}

function applyState(){
  // ---- blueprint mode ----
  if (state.blueprint){
    scene.background = new THREE.Color(0x0d2c4d);
    scene.fog = null;
    G.env.visible = false;
    G.dims.visible = true;
    G.labels.visible = true;
    G.roof.visible = false;
    G.wallsExt.visible = true;
    G.wallsInt.visible = true;
    G.slabs.visible = true;
    G.floors.visible = true;
    G.doors.visible = true;
    G.windows.visible = true;
    G.furniture.visible = false;
    setBlueprintMaterials(true);
    // force top ortho
    if (currentView !== 'top'){
      setOrthoFrustum(11.5, 9.5);
      ortho.up.set(0,0,-1);
      ortho.position.set(0, 60, 0.001);
      ortho.lookAt(0,0,0);
      switchCamera(ortho);
      controls.target.set(0,0,0);
      controls.enableRotate = false;
      controls.update();
    }
    labelSprites.forEach(s=>{
      s.material.color.set(0xffffff);
    });
    return;
  }

  scene.background = SKY;
  scene.fog = new THREE.Fog(0x9dc6ea, 70, 230);
  G.env.visible = true;
  setBlueprintMaterials(false);

  G.roof.visible      = state.roof;
  G.wallsInt.visible  = state.interior && !state.blueprint;
  G.wallsExt.visible  = state.walls;
  G.furniture.visible = state.furniture;
  G.labels.visible    = state.labels;
  G.dims.visible      = state.dims;

  // upper floor visibility = its slab + upper walls + upper furniture + upper rooms
  const showUpper = state.upper;
  G.slabs.children.forEach(o=>{
    if (o.userData.tag !== 'slab') return;
    const isUpper = o.position.y > 3.0;
    o.visible = isUpper ? showUpper : true;
  });
  // upper floors
  floorMeshes.forEach(m=>{
    if (m.userData.room.fl === 1) m.visible = showUpper;
  });
  // upper walls (interior) — they live in G.wallsInt; hide those whose y0 > 3
  G.wallsInt.children.forEach(o=>{
    const w = o.userData.wall;
    if (!w) return;
    if (w.y0 > 3.0) o.visible = showUpper;
  });
  // exterior upper walls
  G.wallsExt.children.forEach(o=>{
    const w = o.userData.wall;
    if (!w) return;
    if (w.y0 > 3.0) o.visible = showUpper;
  });
  // upper labels
  G.labels.children.forEach(s=>{
    if (s.userData.room && s.userData.room.fl === 1) s.visible = showUpper;
  });
  // upper doors/windows
  G.doors.children.forEach(g=>{ if (g.position.y > 3.2) g.visible = showUpper; });
  G.windows.children.forEach(g=>{ if (g.position.y > 3.2) g.visible = showUpper; });
  // roof always visible unless hidden
  G.roof.visible = state.roof;
}

let bpCache = [];
function setBlueprintMaterials(on){
  if (on){
    if (bpCache.length) return;
    world.traverse(o=>{
      if (!o.isMesh) return;
      if (o.userData.tag === 'env' || o.userData.tag === 'dims') return;
      bpCache.push({o, m:o.material});
      const isWall = o.userData.tag === 'wall';
      const isGlass = o.material === MAT.glass;
      o.material = isWall ? MAT.bpSolid : (isGlass ? MAT.bp : MAT.bp);
    });
  } else {
    for (const c of bpCache) c.o.material = c.m;
    bpCache = [];
  }
}

/* ---- UI wiring ---- */
document.querySelectorAll('[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if (state.blueprint) setToggle('blueprint', false);
    applyView(btn.dataset.view);
  });
});
document.querySelectorAll('.toggle').forEach(el=>{
  el.addEventListener('click', ()=>{
    const k = el.dataset.toggle;
    const on = !state[k];
    if (k === 'blueprint'){
      state.blueprint = on;
      el.classList.toggle('on', on);
      if (on){
        applyState();
      } else {
        applyState();
        applyView(currentView);
      }
      return;
    }
    setToggle(k, on);
  });
});
function highlightViewButton(name){
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === name);
  });
}

document.getElementById('camOrbit').onclick = ()=>{ controls.enableRotate = true; };
document.getElementById('camPan').onclick = ()=>{ controls.enablePan = true; };
document.getElementById('camZoom').onclick = ()=>{
  const d = activeCam.position.distanceTo(controls.target);
  activeCam.position.lerpVectors(activeCam.position, controls.target, 0.25);
  controls.update();
};
document.getElementById('camReset').onclick = ()=>{ applyView(currentView); };

/* ---- room picking ---- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;

renderer.domElement.addEventListener('pointerdown', e=>{
  downPos = {x:e.clientX, y:e.clientY};
});
renderer.domElement.addEventListener('pointerup', e=>{
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  if (Math.hypot(dx, dy) > 5) return;      // it was a drag

  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, activeCam);

  const targets = floorMeshes.filter(m=>m.visible && (!m.userData.room || m.userData.room.fl===0 || state.upper || state.blueprint));
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length){
    showRoom(hits[0].object.userData.room);
  } else {
    hideRoom();
  }
});

const infoEl = document.getElementById('info');
function showRoom(r){
  if (!r) return;
  const w = (r.x1 - r.x0), d = (r.z1 - r.z0);
  const areaM = w*d, areaFt = Math.round(areaM * M2_TO_FT2);
  document.getElementById('iName').textContent = r.name || 'Room';
  document.getElementById('iFloor').textContent = r.fl === 0 ? 'Ground Floor' : 'Upper Floor';
  document.getElementById('iDim').textContent =
    `${(w/FT).toFixed(1)}' × ${(d/FT).toFixed(1)}'  (${w.toFixed(2)} × ${d.toFixed(2)} m)`;
  document.getElementById('iArea').textContent = `≈ ${areaFt} sq ft  ·  ${areaM.toFixed(1)} m²`;
  document.getElementById('iCeil').textContent = r.fl === 0 ? '2.95 m (9\'-8")' : '2.75 m (9\'-0")';
  infoEl.classList.add('show');
}
function hideRoom(){ infoEl.classList.remove('show'); }
document.getElementById('iClose').onclick = hideRoom;

/* ---- resize ---- */
function onResize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  persp.aspect = w/h;
  persp.updateProjectionMatrix();
  const v = VIEWS[currentView];
  if (v && v.halfW) setOrthoFrustum(v.halfW, v.halfH);
  else setOrthoFrustum(11, 8);
}
addEventListener('resize', onResize);

/* ---- animation ---- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // subtle label float to keep them readable
  controls.update();
  renderer.render(scene, activeCam);
}

/* ---- boot ---- */
onResize();
applyView('exterior');
applyState();
highlightViewButton('exterior');
animate();
document.getElementById('loading').style.display = 'none';
